name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :composeApp:allTests :composeApp:assembleDebug
